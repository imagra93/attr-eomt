# Minimal example dataset for attr-eomt.
#
# Same schema as configs/coco.yaml. Paths are relative to `path` (which is itself
# relative to THIS file, or absolute). `path: .` therefore means "this folder".
#
# Everything the model needs is auto-discovered from the COCO JSONs below:
#   - the primary classes (`nc`) from `categories`
#   - any secondary per-instance classification heads from the (optional)
#     top-level `attributes` list + per-annotation `attributes` maps
# so there are NO class counts or head definitions to maintain here.
#
# Layout:
#   data/sample_dataset/
#     data.yaml                          <- this file
#     annotations/instances_train.json   <- tiny COCO + attributes (see below)
#     annotations/instances_val.json
#     images/train/*.jpg                 <- your images (NOT shipped here)
#     images/val/*.jpg
#
# The JSONs demonstrate the attributes extension that powers the secondary heads:
# a top-level `attributes` list (one entry per head, each with its own label
# vocabulary) and a per-annotation `attributes: {head: id}` map. Raw ids are
# remapped to a contiguous 0..n-1 per head, so non-contiguous ids (e.g. scale
# 1/2/3) are fine. A dataset with NO `attributes` is plain instance segmentation.
#
# The attribute names used here (`scale`, `viewpoint`) are only examples — use
# whatever attributes your task needs, and as many heads as you like.
#
# Class-conditional heads (optional): give an attribute definition an
# `applies_to` list of primary-class names or ids, and that head is only trained
# on — and only emitted for — instances of those classes. This is hard routing on
# the primary class, so different attributes can attach to different classes and
# each keeps its own label vocabulary. Omit `applies_to` and the head applies to
# every class (the original behaviour):
#
#   "attributes": [
#     {"name": "posture", "categories": [...], "applies_to": ["cat", "dog"]}
#   ]
#
# Missing / untagged values are always fine: an instance with no value for a head
# (or an out-of-scope instance for an `applies_to` head) is ignored by that head's
# loss (-100), never trained as class 0. So partially-tagged datasets just work.
#
# Sidecar format (optional): instead of embedding attributes in the COCO JSON you
# may keep the JSON as plain COCO and drop, in the dataset root, an
# `attributes.yaml` schema + `attributes/<split>.json` values keyed by annotation
# id (`{ann_id: {head: value}}`, value = label or raw id). If present (and the JSON
# has no embedded `attributes`), it is merged in memory before loading — so a plain
# COCO dataset always works, and the sidecar is picked up automatically if you add
# it. Embedded `attributes` in the JSON take precedence.

path: .
train_images: images/train
train_json:   annotations/instances_train.json
val_images:   images/val
val_json:     annotations/instances_val.json
download: false
