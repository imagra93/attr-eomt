# Post-training for 1-4 photos of one subject predicted together — stage A, the config that
#
#   python scripts/train_multiview.py --data <dataset>/data.yaml --weights best.pt --device 0,1
#
# runs (it is scripts/train.py with this file, --batch 1 --epochs 2 --val-interval 1 --name multiview).
#
# Keys: eomt.engine.train.DEFAULT_MULTIVIEW. --batch counts sets of photos (a set of 4 photos at 644 px takes
# ~15 GB on an RTX 3090 with this config).
xview:
  mode: blocks          # blocks: a cross-view sublayer after each query block (level 2); refiner: the level-1 baseline
  max_views: 4
  # keys: both          # what a query reads in the other photos: both (their queries and patches), queries, patches
match_dim: 128          # cross-photo matching head (0 = none)
match_w: 1.0            # its loss weight
match_tau: 0.1          # and temperature
# match_loss: infonce   # infonce (relative per anchor) | sigmoid (calibrated similarities) | dustbin (Sinkhorn + "no partner")
# match_residual: false # true: start the head as re-ID's fingerprint plus a learned residual (match_dim = hidden size: exact)
# match_neg_conf: 0.3   # confident unmatched queries (false detections, duplicates) as negatives; null = off
# match_hard_w: 1.0     # weight of the negatives agreeing on match_hard_by (e.g. 2.0)
# match_hard_by: [class]
# link_group_by: [class]   # also score the validation links per gate group, and calibrate them that way
# linked_w: 1.0         # weight of the instances another photo of the set shows, in the detection / attribute losses
# consistency_w: 0.0    # the views of one instance agree on their attributes (consistency_heads: default categorical)
# view_types: false     # true: tell the cross-view attention each photo's view_type (real sets)
trainable:              # parameter group (or parameter-name prefix, e.g. aux_heads.<head>) -> multiplier of --lr;
  xview: 1.0            # everything else in the checkpoint stays frozen
  match_head: 1.0
  # xview_scale: 10.0   # the cross-view LayerScales at their own LR (they open slowly)
  # stage B, only if stage A falls short: --weights <stage A best.pt> and add
  # query_blocks: 0.1
# val_synthetic: true   # false: skip the synthetic validation sets when there are real ones
# val_interval: {photos: 2, synthetic: 2, real: 1}   # epochs between validations of each part
sets:                   # eomt.data.sets.SetConfig
  max_views: 4
  p_single: 0.3
  cases: {small: 1.0, degraded: 1.0, closeup: 1.0, occluded: 1.0}
  p_elsewhere: 0.2
  p_distractor: 0.5
  p_flipped_copy: 0.25
